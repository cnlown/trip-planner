window.doUpdateKey = async function() {
  const key = document.getElementById('new-key-input').value.trim();
  if (!key.startsWith('sk-')) { log('Key must start with sk-', 'err'); return; }
  const btn = document.getElementById('key-btn');
  btn.disabled = true; btn.textContent = 'Saving…';
  document.getElementById('log').textContent = '';
  try {
    await setDoc(doc(db, 'config', 'app'), { anthropicKey: key }, { merge: true });
    log('✓ API key updated in Firestore.', 'ok');
    log('You can now close this page and use Ask Claude in the app.', 'ok');
    btn.textContent = '✓ Done';
  } catch(e) {
    log('Failed: ' + e.message, 'err');
    btn.disabled = false; btn.textContent = 'Update Key';
  }
};

window.doRestoreNola = async function() {
  const btn = document.getElementById('restore-btn');
  btn.disabled = true; btn.textContent = 'Restoring…';
  document.getElementById('log').textContent = '';
  try {
    log('Finding NOLA trip…', 'info');
    const snap = await getDocs(collection(db, 'trips'));
    let nolaId = null;
    snap.forEach(d => { if (d.data().title === 'New Orleans, December 2026') nolaId = d.id; });
    if (!nolaId) { log('NOLA trip not found.', 'err'); btn.textContent = 'Not Found'; return; }
    log('Restoring flights, hotel, payment, places…', 'info');
    await updateDoc(doc(db, 'trips', nolaId), { ...NOLA_CORE, places: NOLA_PLACES_FULL });
    log('✓ All NOLA data restored (' + NOLA_PLACES_FULL.length + ' places + flights, hotel, payment).', 'ok');
    btn.textContent = '✓ Done';
  } catch(e) {
    log('Failed: ' + e.message, 'err');
    btn.disabled = false; btn.textContent = 'Retry';
  }
};

    snap.forEach(d => { if(d.data().title === 'New Orleans, December 2026') nolaId = d.id; });
    if (!nolaId) { log('NOLA trip not found in Firestore.', 'err'); btn.textContent = 'Not Found'; return; }
    log('Found NOLA trip (id: ' + nolaId + '). Updating places...', 'info');
    await updateDoc(doc(db, 'trips', nolaId), { places: NOLA_PLACES_FULL });
    log('✓ Places updated — ' + NOLA_PLACES_FULL.length + ' places now in Firestore (added Brennan\'s).', 'ok');
    btn.textContent = '✓ Done';
  } catch(e) {
    log('Sync failed: ' + e.message, 'err');
    btn.disabled = false; btn.textContent = 'Retry';
  }
};

window.doUpload = async function() {
  const btn = document.getElementById('upload-btn');
  btn.disabled = true;
  btn.textContent = 'Uploading...';
  document.getElementById('log').textContent = '';

  try {
    // Check for existing trips with same title
    log('Checking for existing trips...', 'info');
    const snap = await getDocs(collection(db, 'trips'));
    const existing = [];
    snap.forEach(d => { if(d.data().title === NOLA_DATA.title) existing.push(d.id); });

    if (existing.length) {
      log('⚠️  A trip with this title already exists (id: ' + existing[0] + ').', 'err');
      log('Delete it from Firestore console first if you want to re-upload.', 'err');
      btn.textContent = 'Already Uploaded';
      return;
    }

    log('Writing trip document to Firestore...', 'info');
    const docRef = await addDoc(collection(db, 'trips'), NOLA_DATA);
    log('✓ Trip uploaded! Document ID: ' + docRef.id, 'ok');
    log('✓ ' + NOLA_DATA.places.length + ' places included', 'ok');
    log('✓ Flights, hotel, payment data included', 'ok');
    log('\nYou can now close this page. The trip will appear in the main app.', 'ok');
    btn.textContent = '✓ Done';
  } catch(e) {
    log('Upload failed: ' + e.message, 'err');
    btn.disabled = false;
    btn.textContent = 'Retry Upload';
  }
};
