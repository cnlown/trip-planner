<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trip Planner</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }

:root {
  --bg:#0f0e0c; --surface:#1a1814; --border:#2e2b25;
  --text:#f0ead8; --muted:#8a7f6a;
  --hotel:#e8b84b; --restaurant:#e85c4a; --bar:#5cb8e8;
  --rooftop:#9b7fe8; --activity:#5ce87a; --shopping:#e87f5c;
}

body { font-family:'DM Sans',sans-serif; background:var(--bg); color:var(--text); height:100vh; display:flex; flex-direction:column; overflow:hidden; }

/* ── SCREENS ── */
.screen { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:9000; background:var(--bg); padding:30px; gap:20px; }
.screen.hidden { display:none; }

/* LOGIN */
#login-screen h1 { font-family:'Playfair Display',serif; font-size:32px; color:var(--hotel); }
#login-screen p { font-size:13px; color:var(--muted); text-align:center; max-width:360px; line-height:1.6; }
.google-btn { display:flex; align-items:center; gap:12px; padding:12px 24px; background:white; border:none; border-radius:8px; cursor:pointer; font-family:'DM Sans',sans-serif; font-size:14px; font-weight:500; color:#1a1a1a; transition:all 0.2s; box-shadow:0 2px 8px rgba(0,0,0,0.3); }
.google-btn:hover { box-shadow:0 4px 16px rgba(0,0,0,0.4); transform:translateY(-1px); }
.google-btn img { width:20px; height:20px; }
.login-error { font-size:12px; color:#e85c4a; text-align:center; display:none; }

/* LOADING */
#loading-screen h2 { font-family:'Playfair Display',serif; font-size:22px; color:var(--hotel); }
#loading-screen p { font-size:12px; color:var(--muted); letter-spacing:0.08em; text-transform:uppercase; }
.loader { width:40px; height:40px; border:3px solid var(--border); border-top-color:var(--hotel); border-radius:50%; animation:spin 0.8s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }

/* TRIP SELECTOR */
#trip-selector-screen h1 { font-family:'Playfair Display',serif; font-size:26px; color:var(--hotel); }
#trip-selector-screen p { font-size:13px; color:var(--muted); text-align:center; max-width:400px; line-height:1.6; }
.trip-cards { display:flex; flex-wrap:wrap; gap:12px; justify-content:center; max-width:600px; }
.trip-card { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:20px 28px; cursor:pointer; transition:all 0.2s; text-align:center; min-width:160px; }
.trip-card:hover { border-color:var(--hotel); background:rgba(232,184,75,0.05); }
.trip-card .tc-emoji { font-size:28px; margin-bottom:8px; }
.trip-card .tc-title { font-size:14px; font-weight:500; color:var(--text); margin-bottom:4px; }
.trip-card .tc-dates { font-size:11px; color:var(--muted); }
.new-trip-card { border-style:dashed; }
.new-trip-card .tc-title { color:var(--muted); }
.user-bar { display:flex; align-items:center; gap:10px; font-size:12px; color:var(--muted); }
.user-bar img { width:28px; height:28px; border-radius:50%; border:1px solid var(--border); }
.sign-out-btn { background:transparent; border:1px solid var(--border); color:var(--muted); padding:4px 10px; border-radius:12px; cursor:pointer; font-size:11px; font-family:'DM Sans',sans-serif; transition:all 0.15s; }
.sign-out-btn:hover { border-color:var(--muted); color:var(--text); }

/* ── PANEL TABS ── */
.panel-tabs { display:flex; border-bottom:1px solid var(--border); flex-shrink:0; }
.panel-tab { flex:1; padding:10px; font-size:12px; font-family:'DM Sans',sans-serif; font-weight:500; color:var(--muted); border:none; background:transparent; cursor:pointer; border-bottom:2px solid transparent; transition:all 0.15s; }
.panel-tab:hover { color:var(--text); }
.panel-tab.active { color:var(--hotel); border-bottom-color:var(--hotel); }
.panel-view { display:flex; flex-direction:column; flex:1; overflow:hidden; }
.panel-view.hidden { display:none; }

/* ── ITINERARY ── */
.itin-list { flex:1; overflow-y:auto; padding:8px; }
.itin-list::-webkit-scrollbar { width:3px; }
.itin-list::-webkit-scrollbar-thumb { background:var(--border); border-radius:2px; }
.day-card { border:1px solid var(--border); border-radius:10px; margin-bottom:8px; overflow:hidden; transition:border-color 0.15s; }
.day-card.active-day { border-color:var(--hotel); }
.day-header { display:flex; align-items:center; justify-content:space-between; padding:9px 12px; cursor:pointer; background:rgba(255,255,255,0.02); transition:background 0.12s; user-select:none; }
.day-header:hover { background:rgba(255,255,255,0.05); }
.day-title { font-size:12px; font-weight:600; color:var(--text); }
.day-count { font-size:10px; color:var(--muted); background:var(--border); padding:2px 7px; border-radius:10px; }
.day-items { padding:4px 8px 8px; }
.itin-item { display:flex; align-items:center; gap:7px; padding:5px 4px; border-radius:6px; cursor:grab; transition:background 0.1s; }
.itin-item:hover { background:rgba(255,255,255,0.04); }
.itin-item.dragging { opacity:0.35; }
.itin-item.drag-over { background:rgba(232,184,75,0.08); outline:1px solid rgba(232,184,75,0.35); outline-offset:-1px; }
.drag-handle { color:var(--border); font-size:13px; cursor:grab; flex-shrink:0; user-select:none; }
.drag-handle:hover { color:var(--muted); }
.itin-color-bar { width:3px; height:26px; border-radius:2px; flex-shrink:0; }
.itin-info { flex:1; min-width:0; }
.itin-name { font-size:11.5px; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.ts-badge { display:inline-flex; align-items:center; font-size:9px; padding:1px 6px; border-radius:8px; border:1px solid var(--border); color:var(--muted); cursor:pointer; margin-top:2px; transition:all 0.12s; white-space:nowrap; }
.ts-badge:hover { border-color:var(--muted); color:var(--text); }
.itin-remove { background:transparent; border:none; color:var(--muted); font-size:13px; cursor:pointer; flex-shrink:0; padding:2px 6px; border-radius:4px; transition:all 0.12s; opacity:0.5; }
.itin-item:hover .itin-remove { opacity:1; }
.itin-remove:hover { color:#e85c4a; background:rgba(232,92,74,0.12); opacity:1; }
.day-empty { padding:10px 8px; font-size:11px; color:var(--muted); font-style:italic; text-align:center; }
.ts-picker { position:fixed; z-index:3000; background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:10px; box-shadow:0 8px 30px rgba(0,0,0,0.6); min-width:165px; }
.ts-option { display:flex; align-items:center; gap:8px; padding:6px 8px; border-radius:6px; cursor:pointer; font-size:12px; color:var(--text); transition:background 0.1s; }
.ts-option:hover { background:rgba(255,255,255,0.06); }
.ts-option.selected { color:var(--hotel); }
.ts-custom-input { width:100%; background:var(--bg); border:1px solid var(--border); border-radius:6px; color:var(--text); font-family:'DM Sans',sans-serif; font-size:12px; padding:5px 8px; margin-top:6px; outline:none; box-sizing:border-box; }
.ts-custom-input:focus { border-color:var(--hotel); }
.popup-itin-section { margin-top:10px; border-top:1px solid var(--border); padding-top:10px; }
.popup-itin-label { font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:0.06em; margin-bottom:6px; }
.popup-itin-row { display:flex; gap:6px; align-items:center; }
.popup-select { flex:1; background:var(--bg); border:1px solid var(--border); color:var(--text); font-family:'DM Sans',sans-serif; font-size:11px; padding:5px 7px; border-radius:6px; outline:none; cursor:pointer; min-width:0; }
.popup-select:focus { border-color:var(--hotel); }
.popup-select option { background:var(--surface); }
.popup-add-btn { background:var(--hotel); border:none; color:#0f0e0c; font-size:15px; font-weight:700; width:28px; height:28px; border-radius:6px; cursor:pointer; flex-shrink:0; transition:background 0.15s; line-height:1; }
.popup-add-btn:hover { background:#d4a53a; }
.popup-day-tags { display:flex; flex-wrap:wrap; gap:4px; margin-top:6px; }
.popup-day-tag { display:inline-flex; align-items:center; gap:4px; background:rgba(232,184,75,0.1); border:1px solid rgba(232,184,75,0.25); color:var(--hotel); padding:2px 8px; border-radius:10px; font-size:10px; }
.popup-day-tag-remove { background:transparent; border:none; color:var(--hotel); cursor:pointer; font-size:11px; padding:0; opacity:0.6; margin-left:2px; }
.popup-day-tag-remove:hover { opacity:1; }

/* ── RESERVATIONS FORM ── */
.res-add-btn { display:flex; align-items:center; justify-content:center; gap:6px; padding:8px 14px; background:rgba(232,184,75,0.08); border:1px solid rgba(232,184,75,0.25); color:var(--hotel); border-radius:8px; cursor:pointer; font-size:12px; font-weight:500; font-family:'DM Sans',sans-serif; margin-bottom:12px; transition:all 0.15s; width:100%; }
.res-add-btn:hover { background:rgba(232,184,75,0.16); }
.res-add-form { background:rgba(255,255,255,0.02); border:1px solid var(--border); border-radius:10px; padding:14px; margin-bottom:12px; display:none; }
.res-add-form.open { display:block; }
.res-form-row { display:flex; gap:8px; margin-bottom:8px; }
.res-input { flex:1; background:var(--bg); border:1px solid var(--border); color:var(--text); font-family:'DM Sans',sans-serif; font-size:12px; padding:7px 10px; border-radius:6px; outline:none; min-width:0; }
.res-input:focus { border-color:var(--hotel); }
.res-input option { background:var(--surface); }
.res-form-btns { display:flex; gap:8px; margin-top:10px; }
.res-save-btn { flex:1; background:var(--hotel); border:none; color:#0f0e0c; padding:8px; border-radius:6px; font-family:'DM Sans',sans-serif; font-size:12px; font-weight:600; cursor:pointer; transition:background 0.15s; }
.res-save-btn:hover { background:#d4a53a; }
.res-cancel-btn { background:var(--border); border:none; color:var(--muted); padding:8px 16px; border-radius:6px; font-family:'DM Sans',sans-serif; font-size:12px; cursor:pointer; transition:all 0.15s; }
.res-cancel-btn:hover { color:var(--text); }
.res-delete-btn { background:transparent; border:none; color:var(--muted); font-size:12px; cursor:pointer; padding:2px 6px; border-radius:4px; opacity:0; transition:all 0.12s; }
.res-card:hover .res-delete-btn { opacity:0.6; }
.res-delete-btn:hover { color:#e85c4a !important; background:rgba(232,92,74,0.1); opacity:1 !important; }

/* ── MOBILE ── */
.panel-handle { display:none; justify-content:center; padding:10px 0 4px; cursor:pointer; flex-shrink:0; }
.panel-handle-bar { width:36px; height:4px; background:var(--border); border-radius:2px; }
.panel-toggle { display:none; position:fixed; bottom:20px; left:50%; transform:translateX(-50%); z-index:600; background:var(--surface); border:1px solid var(--border); color:var(--text); padding:10px 20px; border-radius:20px; font-size:12px; font-weight:500; font-family:'DM Sans',sans-serif; cursor:pointer; box-shadow:0 4px 20px rgba(0,0,0,0.5); align-items:center; gap:7px; transition:all 0.18s; white-space:nowrap; }
.panel-toggle:hover { border-color:var(--hotel); color:var(--hotel); }
.panel-backdrop { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.55); z-index:999; }
.panel-backdrop.show { display:block; }

@media (max-width:768px) {
  .main { flex-direction:column; }
  #map { flex:1; min-height:0; }
  .panel { position:fixed !important; bottom:0; left:0; right:0; width:100% !important; height:72vh; transform:translateY(100%); transition:transform 0.3s ease; border-left:none !important; border-top:1px solid var(--border); border-radius:16px 16px 0 0; z-index:1000; }
  .panel.mobile-open { transform:translateY(0); }
  .panel-handle { display:flex; }
  .panel-toggle { display:flex; }
  .filters { overflow-x:auto; flex-wrap:nowrap !important; -webkit-overflow-scrolling:touch; }
  .filters::-webkit-scrollbar { display:none; }
  .header-btn.ghost span { display:none; }
  .detail-popup { right:8px !important; left:8px !important; width:auto !important; }
}

/* ── HEADER ── */
header { padding:10px 16px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; background:var(--surface); flex-shrink:0; gap:10px; flex-wrap:wrap; }
.title-block h1 { font-family:'Playfair Display',serif; font-size:17px; font-weight:700; color:var(--hotel); white-space:nowrap; }
.title-block p { font-size:11px; color:var(--muted); letter-spacing:0.07em; text-transform:uppercase; margin-top:1px; }
.header-right { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.header-btn { display:flex; align-items:center; gap:5px; padding:5px 12px; border-radius:20px; border:1.5px solid; background:transparent; cursor:pointer; font-family:'DM Sans',sans-serif; font-size:11px; font-weight:500; letter-spacing:0.04em; transition:all 0.18s; white-space:nowrap; }
.header-btn.gold { border-color:var(--hotel); color:var(--hotel); }
.header-btn.gold:hover { background:var(--hotel); color:#0f0e0c; }
.header-btn.ghost { border-color:var(--border); color:var(--muted); }
.header-btn.ghost:hover { border-color:var(--muted); color:var(--text); }
.header-avatar { width:26px; height:26px; border-radius:50%; border:1px solid var(--border); cursor:pointer; }

/* ── FILTERS ── */
.filters { display:flex; gap:5px; flex-wrap:wrap; align-items:center; }
.filter-btn { display:flex; align-items:center; gap:5px; padding:5px 10px; border-radius:20px; border:1.5px solid; background:transparent; cursor:pointer; font-family:'DM Sans',sans-serif; font-size:11px; font-weight:500; letter-spacing:0.04em; transition:all 0.18s; white-space:nowrap; }
.filter-btn .dot { width:7px; height:7px; border-radius:50%; flex-shrink:0; }
.filter-btn:not(.active) { opacity:0.4; }
.filter-btn.active { color:#0f0e0c !important; }
.filter-btn[data-type="all"] { border-color:var(--text); color:var(--text); }
.filter-btn[data-type="all"].active { background:var(--text); }
.filter-btn[data-type="hotel"] { border-color:var(--hotel); color:var(--hotel); }
.filter-btn[data-type="hotel"].active { background:var(--hotel); }
.filter-btn[data-type="restaurant"] { border-color:var(--restaurant); color:var(--restaurant); }
.filter-btn[data-type="restaurant"].active { background:var(--restaurant); }
.filter-btn[data-type="bar"] { border-color:var(--bar); color:var(--bar); }
.filter-btn[data-type="bar"].active { background:var(--bar); }
.filter-btn[data-type="rooftop"] { border-color:var(--rooftop); color:var(--rooftop); }
.filter-btn[data-type="rooftop"].active { background:var(--rooftop); }
.filter-btn[data-type="activity"] { border-color:var(--activity); color:var(--activity); }
.filter-btn[data-type="activity"].active { background:var(--activity); }
.filter-btn[data-type="shopping"] { border-color:var(--shopping); color:var(--shopping); }
.filter-btn[data-type="shopping"].active { background:var(--shopping); }

/* ── MAIN ── */
.main { display:flex; flex:1; overflow:hidden; }
#map { flex:1; position:relative; }

/* ── PANEL ── */
.panel { width:290px; background:var(--surface); border-left:1px solid var(--border); display:flex; flex-direction:column; overflow:hidden; flex-shrink:0; }
.panel-header { padding:13px 16px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; }
.panel-header h2 { font-family:'Playfair Display',serif; font-size:14px; font-style:italic; color:var(--muted); }
.place-count { font-size:11px; color:var(--muted); background:var(--border); padding:2px 8px; border-radius:10px; }
.place-list { flex:1; overflow-y:auto; padding:8px; }
.place-list::-webkit-scrollbar { width:3px; }
.place-list::-webkit-scrollbar-thumb { background:var(--border); border-radius:2px; }
.place-item { display:flex; align-items:flex-start; gap:10px; padding:9px 10px; border-radius:8px; cursor:pointer; transition:background 0.12s; border:1px solid transparent; margin-bottom:3px; }
.place-item:hover { background:rgba(255,255,255,0.04); }
.place-item.active { background:rgba(255,255,255,0.07); border-color:var(--border); }
.place-color-bar { width:3px; height:34px; border-radius:2px; flex-shrink:0; margin-top:2px; }
.place-info { flex:1; min-width:0; }
.place-name { font-size:12.5px; font-weight:500; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.place-type-tag { font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:0.06em; margin-top:1px; }
.place-note { font-size:11px; color:var(--muted); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.no-results { padding:30px 16px; text-align:center; color:var(--muted); font-size:13px; font-style:italic; }
.place-delete-btn { background:transparent; border:none; color:var(--muted); font-size:13px; cursor:pointer; padding:2px 6px; border-radius:4px; opacity:0; transition:all 0.12s; flex-shrink:0; }
.place-item:hover .place-delete-btn { opacity:0.5; }
.place-delete-btn:hover { color:#e85c4a !important; background:rgba(232,92,74,0.12); opacity:1 !important; }
.place-confirm { background:rgba(232,92,74,0.08); border:1px solid rgba(232,92,74,0.3); border-radius:8px; padding:8px 10px; margin-bottom:3px; display:flex; align-items:center; gap:8px; }
.place-confirm-msg { flex:1; font-size:11px; color:#e85c4a; }
.place-confirm-yes { background:#e85c4a; border:none; color:#fff; font-size:11px; font-weight:600; padding:3px 10px; border-radius:5px; cursor:pointer; font-family:'DM Sans',sans-serif; }
.place-confirm-yes:hover { background:#d04535; }
.place-confirm-no { background:transparent; border:1px solid var(--border); color:var(--muted); font-size:11px; padding:3px 10px; border-radius:5px; cursor:pointer; font-family:'DM Sans',sans-serif; }
.place-confirm-no:hover { color:var(--text); }

/* ── DETAIL POPUP ── */
.detail-popup { position:fixed; right:298px; top:72px; width:310px; background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:16px; z-index:500; display:none; box-shadow:0 8px 40px rgba(0,0,0,0.65); animation:slideUp 0.18s ease; }
@keyframes slideUp { from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);} }
.detail-popup.show { display:block; }
.popup-header { display:flex; align-items:flex-start; justify-content:space-between; gap:8px; margin-bottom:10px; }
.popup-name { font-family:'Playfair Display',serif; font-size:16px; font-weight:700; color:var(--text); line-height:1.3; flex:1; }
.popup-close { background:var(--border); border:none; color:var(--muted); width:22px; height:22px; border-radius:50%; cursor:pointer; font-size:12px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.popup-close:hover { background:#3a3630; }
.popup-badge { display:inline-flex; align-items:center; gap:5px; padding:3px 10px; border-radius:12px; font-size:10px; font-weight:500; letter-spacing:0.06em; text-transform:uppercase; margin-bottom:10px; color:#0f0e0c; }
.popup-address { font-size:11px; color:var(--muted); margin-bottom:10px; }
.popup-notes { font-size:12px; color:var(--text); line-height:1.6; background:rgba(255,255,255,0.03); border-radius:8px; padding:10px; border-left:3px solid; }
.popup-rating { display:flex; align-items:center; gap:6px; margin-top:10px; font-size:12px; color:var(--muted); }
.stars { color:var(--hotel); font-size:11px; }

/* ── MODAL ── */
.modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.75); z-index:2000; display:none; align-items:center; justify-content:center; padding:20px; backdrop-filter:blur(4px); }
.modal-overlay.show { display:flex; }
.modal { background:var(--surface); border:1px solid var(--border); border-radius:16px; width:100%; max-width:680px; max-height:85vh; display:flex; flex-direction:column; overflow:hidden; box-shadow:0 20px 60px rgba(0,0,0,0.7); animation:modalIn 0.2s ease; }
@keyframes modalIn { from{opacity:0;transform:scale(0.96) translateY(10px);}to{opacity:1;transform:scale(1) translateY(0);} }
.modal-header { padding:16px 20px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; flex-shrink:0; }
.modal-header h2 { font-family:'Playfair Display',serif; font-size:18px; font-weight:700; color:var(--hotel); }
.modal-header p { font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:0.07em; margin-top:2px; }
.modal-close-btn { background:var(--border); border:none; color:var(--muted); width:28px; height:28px; border-radius:50%; cursor:pointer; font-size:14px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.modal-close-btn:hover { background:#3a3630; color:var(--text); }
.modal-tabs { display:flex; border-bottom:1px solid var(--border); flex-shrink:0; padding:0 20px; }
.modal-tab { padding:10px 14px; font-size:12px; font-family:'DM Sans',sans-serif; font-weight:500; color:var(--muted); border:none; background:transparent; cursor:pointer; border-bottom:2px solid transparent; transition:all 0.15s; white-space:nowrap; }
.modal-tab:hover { color:var(--text); }
.modal-tab.active { color:var(--hotel); border-bottom-color:var(--hotel); }
.modal-body { flex:1; overflow-y:auto; padding:20px; }
.modal-body::-webkit-scrollbar { width:4px; }
.modal-body::-webkit-scrollbar-thumb { background:var(--border); border-radius:2px; }

.tab-panel.active { display:block; }

/* ── MODAL CONTENT ── */
.info-section { margin-bottom:16px; border:1px solid var(--border); border-radius:10px; overflow:hidden; }
.info-section-header { padding:10px 14px; background:rgba(255,255,255,0.03); display:flex; align-items:center; gap:8px; border-bottom:1px solid var(--border); }
.info-section-header span { font-size:13px; font-weight:600; color:var(--text); }
.sec-badge { font-size:10px; padding:2px 8px; border-radius:10px; font-weight:500; margin-left:auto; }
.info-rows { padding:4px 0; }
.info-row { display:flex; align-items:flex-start; padding:8px 14px; gap:12px; border-bottom:1px solid rgba(255,255,255,0.04); }
.info-row:last-child { border-bottom:none; }
.info-row-label { font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:0.06em; width:90px; flex-shrink:0; padding-top:1px; }
.info-row-value { font-size:12.5px; color:var(--text); flex:1; line-height:1.5; }
.conf-badge { display:inline-block; background:rgba(232,184,75,0.15); color:var(--hotel); padding:1px 7px; border-radius:6px; font-size:11px; font-weight:600; letter-spacing:0.05em; }
.warn-badge { display:inline-flex; align-items:center; gap:4px; background:rgba(232,92,74,0.15); color:#e85c4a; padding:2px 8px; border-radius:6px; font-size:11px; font-weight:500; margin-top:4px; }
.flight-day-label { font-size:10px; text-transform:uppercase; letter-spacing:0.08em; color:var(--muted); padding:8px 14px 2px; }
.flight-card { margin:0 14px 10px; background:rgba(255,255,255,0.02); border:1px solid var(--border); border-radius:8px; padding:12px; }
.flight-route { display:flex; align-items:center; gap:10px; margin-bottom:8px; }
.flight-airport { font-size:20px; font-weight:700; font-family:'Playfair Display',serif; color:var(--text); }
.flight-arrow { flex:1; display:flex; align-items:center; gap:6px; color:var(--muted); }
.flight-line { flex:1; height:1px; background:var(--border); }
.flight-meta { display:flex; gap:16px; flex-wrap:wrap; }
.flight-meta-item { font-size:11px; color:var(--muted); }
.flight-meta-item strong { color:var(--text); font-weight:500; }
.payment-alert { background:rgba(232,92,74,0.1); border:1px solid rgba(232,92,74,0.3); border-radius:10px; padding:14px 16px; margin-bottom:16px; display:flex; gap:12px; align-items:flex-start; }
.pa-icon { font-size:20px; flex-shrink:0; }
.pa-title { font-size:13px; font-weight:600; color:#e85c4a; margin-bottom:4px; }
.pa-body { font-size:12px; color:var(--muted); line-height:1.5; }
.empty-res { padding:40px 20px; text-align:center; color:var(--muted); font-size:13px; font-style:italic; }
.empty-icon { font-size:32px; margin-bottom:10px; }
.res-card { border:1px solid var(--border); border-radius:8px; padding:12px 14px; margin-bottom:10px; background:rgba(255,255,255,0.02); }
.res-card-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:6px; }
.res-card-name { font-size:13px; font-weight:500; color:var(--text); }
.res-card-type { font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:0.06em; }
.res-card-rows { display:flex; flex-direction:column; gap:4px; margin-top:8px; }
.res-card-row { display:flex; gap:10px; font-size:11px; }
.res-card-label { color:var(--muted); width:80px; flex-shrink:0; }
.res-card-value { color:var(--text); }
</style>
</head>
<body>

<!-- LOGIN SCREEN -->
<div class="screen" id="login-screen">
  <div style="font-size:48px">🗺️</div>
  <h1>Trip Planner</h1>
  <p>Your personal travel companion. Sign in with Google to access your trips.</p>
  <button class="google-btn" onclick="signInWithGoogle()">
    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google">
    Sign in with Google
  </button>
  <div class="login-error" id="login-error">Access denied. This app is private.</div>
</div>

<!-- LOADING SCREEN -->
<div class="screen hidden" id="loading-screen">
  <div class="loader"></div>
  <h2>Trip Planner</h2>
  <p>Loading...</p>
</div>

<!-- TRIP SELECTOR SCREEN -->
<div class="screen hidden" id="trip-selector-screen">
  <div class="user-bar" id="user-bar"></div>
  <div style="font-size:40px">🗺️</div>
  <h1>Your Trips</h1>
  <p>Select a trip to open it on the map.</p>
  <div class="trip-cards" id="trip-cards">
    <div class="trip-card new-trip-card" onclick="alert('Coming soon — ask Claude to create a new trip JSON!')">
      <div class="tc-emoji">➕</div>
      <div class="tc-title">New Trip</div>
      <div class="tc-dates">Coming soon</div>
    </div>
  </div>
</div>

<!-- MAIN APP -->
<header id="app-header" style="display:none">
  <div class="title-block">
    <h1 id="header-title"></h1>
    <p id="header-subtitle"></p>
  </div>
  <div class="header-right">
    <button class="header-btn gold" onclick="openModal()">✈️ Trip Details</button>
    <button class="header-btn ghost" onclick="showTripSelector()">↩ Trips</button>
    <div class="filters" id="filters">
      <button class="filter-btn active" data-type="all">All</button>
      <button class="filter-btn" data-type="hotel"><span class="dot" style="background:var(--hotel)"></span>Hotel</button>
      <button class="filter-btn" data-type="restaurant"><span class="dot" style="background:var(--restaurant)"></span>Restaurants</button>
      <button class="filter-btn" data-type="bar"><span class="dot" style="background:var(--bar)"></span>Bars</button>
      <button class="filter-btn" data-type="rooftop"><span class="dot" style="background:var(--rooftop)"></span>Rooftops</button>
      <button class="filter-btn" data-type="activity"><span class="dot" style="background:var(--activity)"></span>Activities</button>
      <button class="filter-btn" data-type="shopping"><span class="dot" style="background:var(--shopping)"></span>Shopping</button>
    </div>
    <img class="header-avatar" id="header-avatar" src="" alt="" onclick="signOut()" title="Sign out">
  </div>
</header>

<div class="main" id="app-main" style="display:none">
  <div id="map"></div>
  <div class="panel">
    <div class="panel-handle" onclick="toggleMobilePanel()"><div class="panel-handle-bar"></div></div>
    <div class="panel-tabs">
      <button class="panel-tab active" data-panel="places">Places</button>
      <button class="panel-tab" data-panel="itinerary">Itinerary</button>
    </div>
    <div class="panel-view" id="panel-places">
      <div class="panel-header">
        <h2>Places</h2>
        <span class="place-count" id="place-count"></span>
      </div>
      <div class="place-list" id="place-list"></div>
    </div>
    <div class="panel-view hidden" id="panel-itinerary">
      <div class="itin-list" id="itin-list"></div>
    </div>
  </div>
</div>

<button class="panel-toggle" id="panel-toggle" onclick="toggleMobilePanel()">🗺️ Places & Itinerary</button>
<div class="panel-backdrop" id="panel-backdrop" onclick="toggleMobilePanel()"></div>

<!-- DETAIL POPUP -->
<div class="detail-popup" id="detail-popup">
  <div class="popup-header">
    <div class="popup-name" id="popup-name"></div>
    <button class="popup-close" onclick="closePopup()">✕</button>
  </div>
  <div class="popup-badge" id="popup-badge"></div>
  <div class="popup-address" id="popup-address"></div>
  <div class="popup-notes" id="popup-notes"></div>
  <div class="popup-rating" id="popup-rating"></div>
  <div class="popup-itin-section" id="popup-itin-section" style="display:none">
    <div class="popup-itin-label">Add to Itinerary</div>
    <div class="popup-itin-row">
      <select class="popup-select" id="popup-day-select"></select>
      <select class="popup-select" id="popup-ts-select">
        <option value="">Time...</option>
        <option value="morning">Morning</option>
        <option value="afternoon">Afternoon</option>
        <option value="evening">Evening</option>
      </select>
      <button class="popup-add-btn" onclick="addActivePlaceToDay()">+</button>
    </div>
    <div class="popup-day-tags" id="popup-day-tags"></div>
  </div>
</div>

<!-- TRIP DETAILS MODAL -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <div class="modal-header">
      <div>
        <h2 id="modal-title"></h2>
        <p id="modal-subtitle"></p>
      </div>
      <button class="modal-close-btn" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-tabs">
      <button class="modal-tab active" data-tab="flights">✈️ Flights</button>
      <button class="modal-tab" data-tab="hotel">🏨 Hotel</button>
      <button class="modal-tab" data-tab="payment">💳 Payment</button>
      <button class="modal-tab" data-tab="reservations">📋 Reservations</button>
      <button class="modal-tab" data-tab="weather">🌤️ Weather</button>
    </div>
    <div class="modal-body">
      <div class="tab-panel active" id="tab-flights"></div>
      <div class="tab-panel" id="tab-hotel"></div>
      <div class="tab-panel" id="tab-payment"></div>
      <div class="tab-panel" id="tab-reservations"></div>
      <div class="tab-panel" id="tab-weather"></div>
    </div>
  </div>
</div>

<!-- FIREBASE -->
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut as fbSignOut, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';
import { getFirestore, collection, getDocs, doc, updateDoc } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

const ALLOWED_EMAILS = ['cnlown@gmail.com', 'brooke1713@gmail.com'];

const firebaseConfig = {
  apiKey: "AIzaSyBkuYcZWb36RJVWI0pl13wJuC3yflCFjEY",
  authDomain: "trip-planner-59596.firebaseapp.com",
  projectId: "trip-planner-59596",
  storageBucket: "trip-planner-59596.firebasestorage.app",
  messagingSenderId: "871104419538",
  appId: "1:871104419538:web:cce58cfcde561d6e783f0b"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const provider = new GoogleAuthProvider();

var TRIP = null;
var map, markers = {}, activeFilter = 'all', activePlace = null, activeDay = null, mapReady = false;
var dragSrc = null, tsPicker = null, pendingDeleteId = null;

const TYPE_CONFIG = {
  hotel:      { color:'#e8b84b', label:'Hotel',       emoji:'🏨' },
  restaurant: { color:'#e85c4a', label:'Restaurant',  emoji:'🍽️' },
  bar:        { color:'#5cb8e8', label:'Bar',         emoji:'🍹' },
  rooftop:    { color:'#9b7fe8', label:'Rooftop Bar', emoji:'🌆' },
  activity:   { color:'#5ce87a', label:'Activity',    emoji:'🎭' },
  shopping:   { color:'#e87f5c', label:'Shopping',    emoji:'🛍️' }
};

const MAP_STYLES = [
  {elementType:'geometry',stylers:[{color:'#1a1814'}]},
  {elementType:'labels.text.stroke',stylers:[{color:'#1a1814'}]},
  {elementType:'labels.text.fill',stylers:[{color:'#9a8f7a'}]},
  {featureType:'road',elementType:'geometry',stylers:[{color:'#2e2b25'}]},
  {featureType:'road',elementType:'geometry.stroke',stylers:[{color:'#0f0e0c'}]},
  {featureType:'road.highway',elementType:'geometry',stylers:[{color:'#3a3630'}]},
  {featureType:'road.arterial',elementType:'labels.text.fill',stylers:[{color:'#7a7060'}]},
  {featureType:'water',elementType:'geometry',stylers:[{color:'#0d1a2a'}]},
  {featureType:'water',elementType:'labels.text.fill',stylers:[{color:'#3a5a7a'}]},
  {featureType:'poi',stylers:[{visibility:'off'}]},
  {featureType:'transit',stylers:[{visibility:'off'}]},
  {featureType:'administrative.locality',elementType:'labels.text.fill',stylers:[{color:'#c0b090'}]},
  {featureType:'administrative.neighborhood',elementType:'labels.text.fill',stylers:[{color:'#7a7060'}]}
];

// ── SCREENS ──
function show(id) { document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden')); const el = document.getElementById(id); if(el) el.classList.remove('hidden'); }
function showApp() { document.getElementById('app-header').style.display='flex'; document.getElementById('app-main').style.display='flex'; document.querySelectorAll('.screen').forEach(s=>s.classList.add('hidden')); }
function hideApp() { document.getElementById('app-header').style.display='none'; document.getElementById('app-main').style.display='none'; }

// ── AUTH ──
window.signInWithGoogle = async function() {
  try {
    const result = await signInWithPopup(auth, provider);
    // onAuthStateChanged handles the rest
  } catch(e) {
    document.getElementById('login-error').style.display='block';
  }
};

window.signOut = async function() {
  await fbSignOut(auth);
};

onAuthStateChanged(auth, async user => {
  if (!user) {
    hideApp();
    show('login-screen');
    document.getElementById('login-error').style.display='none';
    return;
  }

  if (!ALLOWED_EMAILS.includes(user.email)) {
    await fbSignOut(auth);
    document.getElementById('login-error').style.display='block';
    show('login-screen');
    return;
  }

  // Valid user — update avatar
  if(user.photoURL) document.getElementById('header-avatar').src = user.photoURL;

  show('loading-screen');

  // Load trips from Firestore
  try {
    const snap = await getDocs(collection(db, 'trips'));
    const trips = [];
    snap.forEach(doc => trips.push({id: doc.id, ...doc.data()}));
    renderTripSelector(user, trips);
  } catch(e) {
    // Firestore empty or error — show selector with no trips
    renderTripSelector(user, []);
  }
});

// ── TRIP SELECTOR ──
function renderTripSelector(user, trips) {
  // User bar
  document.getElementById('user-bar').innerHTML =
    (user.photoURL ? '<img src="'+user.photoURL+'" alt="">' : '')
    + '<span style="font-size:12px;color:var(--muted)">'+user.displayName+'</span>'
    + '<button class="sign-out-btn" onclick="signOut()">Sign out</button>';

  // Trip cards
  const container = document.getElementById('trip-cards');
  const newCard = container.querySelector('.new-trip-card');
  container.innerHTML = '';

  trips.forEach(trip => {
    const card = document.createElement('div');
    card.className = 'trip-card';
    card.innerHTML = '<div class="tc-emoji">'+(trip.emoji||'🗺️')+'</div>'
      +'<div class="tc-title">'+trip.title+'</div>'
      +'<div class="tc-dates">'+(trip.dates||'')+'</div>';
    card.onclick = () => openTrip(trip);
    container.appendChild(card);
  });

  container.appendChild(newCard || (() => {
    const c = document.createElement('div');
    c.className='trip-card new-trip-card';
    c.innerHTML='<div class="tc-emoji">➕</div><div class="tc-title">New Trip</div><div class="tc-dates">Coming soon</div>';
    return c;
  })());

  hideApp();
  show('trip-selector-screen');
}

window.showTripSelector = function() {
  closePopup(); closeModal();
  show('trip-selector-screen');
};

// ── OPEN TRIP ──
function openTrip(trip) {
  TRIP = trip;
  if (!TRIP.itinerary) TRIP.itinerary = {};
  activeFilter='all'; activePlace=null; activeDay=null;
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  document.querySelector('.filter-btn[data-type="all"]').classList.add('active');
  document.title = trip.title + ' — Trip Planner';
  document.getElementById('header-title').textContent = (trip.emoji||'') + ' ' + trip.title;
  document.getElementById('header-subtitle').textContent = trip.header_subtitle || (trip.dates + ' · ' + trip.travelers);
  document.getElementById('modal-title').textContent = (trip.emoji||'') + ' ' + trip.title;
  document.getElementById('modal-subtitle').textContent = (trip.travelers||'') + ' · ' + (trip.dates||'');
  showApp();
  if(mapReady) { plotMarkers(); renderList(); buildModal(); attachFilterListeners(); attachPanelTabs(); renderItinerary(); }
  else { window._pendingTrip = true; }
}

// ── MAP ──
window.initMap = function() {
  map = new google.maps.Map(document.getElementById('map'), {
    center:{lat:29.952,lng:-90.068}, zoom:14, styles:MAP_STYLES,
    mapTypeControl:false, streetViewControl:false, fullscreenControl:false,
    zoomControlOptions:{position:google.maps.ControlPosition.RIGHT_CENTER}
  });
  mapReady = true;
  if(window._pendingTrip && TRIP) { plotMarkers(); renderList(); buildModal(); attachFilterListeners(); attachPanelTabs(); renderItinerary(); }
};

function makeNumberedIcon(num, type) {
  var cfg = TYPE_CONFIG[type]||{color:'#e8b84b'};
  var s=40, r=s/2;
  var svg='<svg width="'+s+'" height="'+s+'" viewBox="0 0 '+s+' '+s+'" xmlns="http://www.w3.org/2000/svg">'
    +'<circle cx="'+r+'" cy="'+r+'" r="'+(r-2)+'" fill="'+cfg.color+'" stroke="#0f0e0c" stroke-width="2.5"/>'
    +'<text x="'+r+'" y="'+(r+5)+'" text-anchor="middle" font-size="15" font-weight="700" font-family="sans-serif" fill="#0f0e0c">'+num+'</text>'
    +'</svg>';
  return {url:'data:image/svg+xml;charset=UTF-8,'+encodeURIComponent(svg),scaledSize:new google.maps.Size(s,s),anchor:new google.maps.Point(r,r)};
}

function makeIcon(type, active) {
  var cfg = TYPE_CONFIG[type]||{color:'#aaa',emoji:'📍'};
  var s=active?44:36, r=s/2;
  var svg='<svg width="'+s+'" height="'+s+'" viewBox="0 0 '+s+' '+s+'" xmlns="http://www.w3.org/2000/svg">'
    +'<circle cx="'+r+'" cy="'+r+'" r="'+(r-2)+'" fill="'+cfg.color+'" stroke="#0f0e0c" stroke-width="'+(active?3:2)+'"/>'
    +'<text x="'+r+'" y="'+(r+5)+'" text-anchor="middle" font-size="'+(active?18:15)+'">'+cfg.emoji+'</text>'
    +'</svg>';
  return {url:'data:image/svg+xml;charset=UTF-8,'+encodeURIComponent(svg),scaledSize:new google.maps.Size(s,s),anchor:new google.maps.Point(r,r)};
}

function plotMarkers() {
  Object.values(markers).forEach(m=>m.setMap(null));
  markers={};
  (TRIP.places||[]).forEach(p => {
    var m = new google.maps.Marker({position:{lat:p.lat,lng:p.lng},map,icon:makeIcon(p.type,false),title:p.name,zIndex:p.type==='hotel'?100:1});
    m.addListener('click',()=>selectPlace(p.id));
    markers[p.id]=m;
  });
  if(TRIP.places&&TRIP.places.length) {
    var bounds=new google.maps.LatLngBounds();
    TRIP.places.forEach(p=>bounds.extend({lat:p.lat,lng:p.lng}));
    map.fitBounds(bounds,60);
  }
}

// ── PLACE LIST ──
function renderList() {
  var list=document.getElementById('place-list');
  var countEl=document.getElementById('place-count');
  var places=TRIP.places||[];
  var filtered=activeFilter==='all'?places:places.filter(p=>p.type===activeFilter);
  countEl.textContent=filtered.length+' spot'+(filtered.length!==1?'s':'');
  if(!filtered.length){list.innerHTML='<div class="no-results">No places in this category.</div>';return;}
  list.innerHTML=filtered.map(p=>{
    var cfg=TYPE_CONFIG[p.type]||{color:'#aaa',emoji:'📍',label:'Place'};
    if(pendingDeleteId===p.id) {
      return '<div class="place-confirm" id="li-'+p.id+'">'
        +'<div class="place-confirm-msg">Remove <strong>'+p.name+'</strong>?</div>'
        +'<button class="place-confirm-yes" onclick="confirmDeletePlace('+p.id+')">Remove</button>'
        +'<button class="place-confirm-no" onclick="cancelDeletePlace()">Cancel</button>'
        +'</div>';
    }
    return '<div class="place-item'+(activePlace===p.id?' active':'')+'" onclick="selectPlace('+p.id+')" id="li-'+p.id+'">'
      +'<div class="place-color-bar" style="background:'+cfg.color+'"></div>'
      +'<div class="place-info">'
      +'<div class="place-name">'+(p.must?'⭐ ':'')+p.name+'</div>'
      +'<div class="place-type-tag">'+cfg.emoji+' '+cfg.label+'</div>'
      +'<div class="place-note">'+p.address+'</div>'
      +'</div>'
      +'<button class="place-delete-btn" onclick="event.stopPropagation();promptDeletePlace('+p.id+')" title="Remove place">✕</button>'
      +'</div>';
  }).join('');
}

function stars(r){var f=Math.floor(r),h=r%1>=0.5;return'★'.repeat(f)+(h?'½':'')+'☆'.repeat(5-f-(h?1:0));}

window.selectPlace = function(id) {
  activePlace=id;
  var place=(TRIP.places||[]).find(p=>p.id===id);
  if(!place)return;
  var cfg=TYPE_CONFIG[place.type]||{color:'#aaa',emoji:'📍',label:'Place'};
  if(!activeDay)(TRIP.places||[]).forEach(p=>{markers[p.id].setIcon(makeIcon(p.type,p.id===id));markers[p.id].setZIndex(p.id===id?999:p.type==='hotel'?100:1);});
  renderList();
  var li=document.getElementById('li-'+id);
  if(li)li.scrollIntoView({behavior:'smooth',block:'nearest'});
  document.getElementById('popup-name').textContent=place.name;
  var badge=document.getElementById('popup-badge');
  badge.textContent=cfg.emoji+' '+cfg.label; badge.style.background=cfg.color;
  document.getElementById('popup-address').textContent='📍 '+place.address;
  var notes=document.getElementById('popup-notes');
  notes.textContent=place.notes; notes.style.borderLeftColor=cfg.color;
  document.getElementById('popup-rating').innerHTML=place.rating?'<span class="stars">'+stars(place.rating)+'</span>&nbsp;'+place.rating+' / 5':'';
  document.getElementById('detail-popup').classList.add('show');
  map.panTo({lat:place.lat,lng:place.lng});
  if(getTripDays().length) populatePopupItinSection(id);
};

window.closePopup = function() {
  document.getElementById('detail-popup').classList.remove('show');
  activePlace=null;
  if(TRIP&&!activeDay)(TRIP.places||[]).forEach(p=>{markers[p.id].setIcon(makeIcon(p.type,false));markers[p.id].setZIndex(p.type==='hotel'?100:1);});
  renderList();
};

// ── FILTERS ──
function attachFilterListeners() {
  document.querySelectorAll('.filter-btn').forEach(btn=>{
    btn.onclick=function(){
      activeDay=null;
      document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      activeFilter=btn.getAttribute('data-type');

// ── ITINERARY ──
function getTripDays() {
  if (TRIP.activity_dates) return TRIP.activity_dates;
  if (!TRIP.hotel) return [];
  var yearMatch = (TRIP.dates||'').match(/\d{4}/);
  if (!yearMatch) return [];
  var year = yearMatch[0];
  var MONTHS = {January:'01',February:'02',March:'03',April:'04',May:'05',June:'06',July:'07',August:'08',September:'09',October:'10',November:'11',December:'12'};
  function extractDate(str) {
    for (var mon in MONTHS) {
      var m = new RegExp(mon+'\\s+(\\d+)').exec(str||'');
      if (m) return year+'-'+MONTHS[mon]+'-'+String(m[1]).padStart(2,'0');
    }
    return null;
  }
  var start = extractDate(TRIP.hotel.checkin);
  var endStr = extractDate(TRIP.hotel.checkout);
  if (!start || !endStr) return [];
  var days = [], cur = new Date(start+'T12:00:00Z'), end = new Date(endStr+'T12:00:00Z');
  end.setUTCDate(end.getUTCDate()-1);
  while (cur <= end) { days.push(cur.toISOString().split('T')[0]); cur.setUTCDate(cur.getUTCDate()+1); }
  return days;
}

function formatDayLabel(d) { return new Date(d+'T12:00:00Z').toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',timeZone:'UTC'}); }
function formatDayShort(d) { return new Date(d+'T12:00:00Z').toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric',timeZone:'UTC'}); }

var TS_LABELS = {morning:'🌅 Morning', afternoon:'☀️ Afternoon', evening:'🌆 Evening'};

function renderItinItem(item, date, idx) {
  var place = (TRIP.places||[]).find(function(p){return p.id===item.placeId;});
  if (!place) return '';
  var cfg = TYPE_CONFIG[place.type]||{color:'#aaa'};
  var tsLabel = item.customTime || (item.timeSlot ? (TS_LABELS[item.timeSlot]||item.timeSlot) : '+ time');
  return '<div class="itin-item" draggable="true" data-date="'+date+'" data-idx="'+idx+'">'
    +'<span class="drag-handle">⠿</span>'
    +'<div class="itin-color-bar" style="background:'+cfg.color+'"></div>'
    +'<div class="itin-info">'
    +'<div class="itin-name">'+(place.must?'⭐ ':'')+place.name+'</div>'
    +'<span class="ts-badge" onclick="openTsPicker(event,\''+date+'\','+idx+')">'+tsLabel+'</span>'
    +'</div>'
    +'<button class="itin-remove" onclick="removeFromDay(\''+date+'\','+idx+')">✕</button>'
    +'</div>';
}

function renderItinerary() {
  var days = getTripDays();
  var itin = TRIP ? (TRIP.itinerary||{}) : {};
  var list = document.getElementById('itin-list');
  if (!list) return;
  if (!days.length) { list.innerHTML='<div style="padding:20px;text-align:center;color:var(--muted);font-size:13px;font-style:italic">No days found.</div>'; return; }
  list.innerHTML = days.map(function(date) {
    var items = itin[date]||[];
    var isActive = activeDay===date;
    return '<div class="day-card'+(isActive?' active-day':'')+'" id="daycard-'+date+'">'
      +'<div class="day-header" onclick="toggleDay(\''+date+'\')">'
      +'<div class="day-title">'+formatDayLabel(date)+'</div>'
      +'<span class="day-count">'+items.length+' stop'+(items.length!==1?'s':'')+'</span>'
      +'</div>'
      +'<div class="day-items" id="dayitems-'+date+'">'
      +(items.length ? items.map(function(item,idx){return renderItinItem(item,date,idx);}).join('') : '<div class="day-empty">No stops yet — click a place on the map.</div>')
      +'</div>'
      +'</div>';
  }).join('');
  attachDragHandlers();
}

function attachDragHandlers() {
  document.querySelectorAll('.itin-item').forEach(function(el) {
    el.addEventListener('dragstart', function(e) {
      dragSrc = {date:el.dataset.date, idx:parseInt(el.dataset.idx)};
      setTimeout(function(){el.classList.add('dragging');},0);
      e.dataTransfer.effectAllowed = 'move';
    });
    el.addEventListener('dragend', function() {
      document.querySelectorAll('.itin-item').forEach(function(i){i.classList.remove('dragging','drag-over');});
    });
    el.addEventListener('dragover', function(e) {
      e.preventDefault();
      document.querySelectorAll('.itin-item').forEach(function(i){i.classList.remove('drag-over');});
      el.classList.add('drag-over');
    });
    el.addEventListener('drop', function(e) {
      e.preventDefault();
      document.querySelectorAll('.itin-item').forEach(function(i){i.classList.remove('drag-over');});
      if (!dragSrc) return;
      var toDate = el.dataset.date, toIdx = parseInt(el.dataset.idx);
      if (dragSrc.date!==toDate || dragSrc.idx===toIdx) return;
      var arr = TRIP.itinerary[dragSrc.date];
      var moved = arr.splice(dragSrc.idx,1)[0];
      arr.splice(toIdx,0,moved);
      dragSrc = null;
      saveItinerary(); renderItinerary();
    });
  });
}

function attachPanelTabs() {
  document.querySelectorAll('.panel-tab').forEach(function(tab) {
    tab.onclick = function() {
      document.querySelectorAll('.panel-tab').forEach(function(t){t.classList.remove('active');});
      tab.classList.add('active');
      var p = tab.dataset.panel;
      document.getElementById('panel-places').classList.toggle('hidden', p!=='places');
      document.getElementById('panel-itinerary').classList.toggle('hidden', p!=='itinerary');

window.toggleDay = function(date) {
  if (activeDay===date) {
    activeDay=null;
    (TRIP.places||[]).forEach(function(p){
      if(!markers[p.id]) return;
      markers[p.id].setVisible(activeFilter==='all'||p.type===activeFilter);
      markers[p.id].setIcon(makeIcon(p.type, p.id===activePlace));
      markers[p.id].setZIndex(p.type==='hotel'?100:1);
    });
  } else {
    activeDay=date;
    var dayItems=((TRIP.itinerary||{})[date]||[]);
    var dayIds=new Set(dayItems.map(function(i){return i.placeId;}));
    (TRIP.places||[]).forEach(function(p){
      if(!markers[p.id]) return;
      var vis=dayIds.has(p.id);
      markers[p.id].setVisible(vis);
      if(vis) {
        var idx=dayItems.findIndex(function(i){return i.placeId===p.id;});
        markers[p.id].setIcon(makeNumberedIcon(idx+1, p.type));
        markers[p.id].setZIndex(1000-idx);
      }
    });
  }
  closePopup(); renderItinerary();
};

function populatePopupItinSection(placeId) {
  var days = getTripDays();
  if (!days.length) { document.getElementById('popup-itin-section').style.display='none'; return; }
  document.getElementById('popup-itin-section').style.display='block';
  var sel = document.getElementById('popup-day-select');
  sel.innerHTML = '<option value="">Add to day...</option>'+days.map(function(d){return '<option value="'+d+'">'+formatDayShort(d)+'</option>';}).join('');
  document.getElementById('popup-ts-select').value='';
  updatePopupItinTags(placeId);
}

function updatePopupItinTags(placeId) {
  placeId = placeId||activePlace;
  if (!placeId) return;
  var tags=[];
  getTripDays().forEach(function(date) {
    ((TRIP.itinerary||{})[date]||[]).forEach(function(item,idx) {
      if (item.placeId===placeId) {
        var ts = item.customTime||(item.timeSlot?(TS_LABELS[item.timeSlot]||item.timeSlot):'');
        tags.push('<span class="popup-day-tag">'+formatDayShort(date)+(ts?' · '+ts:'')
          +'<button class="popup-day-tag-remove" onclick="removeFromDay(\''+date+'\','+idx+')">✕</button></span>');
      }
    });
  });
  document.getElementById('popup-day-tags').innerHTML=tags.join('');
}

window.addActivePlaceToDay = function() {
  if (!activePlace) return;
  var date=document.getElementById('popup-day-select').value;
  var ts=document.getElementById('popup-ts-select').value;
  if (!date) return;
  if (!TRIP.itinerary) TRIP.itinerary={};
  if (!TRIP.itinerary[date]) TRIP.itinerary[date]=[];
  if (TRIP.itinerary[date].some(function(i){return i.placeId===activePlace;})) return;
  TRIP.itinerary[date].push({placeId:activePlace, timeSlot:ts||null, customTime:null});
  saveItinerary(); renderItinerary(); updatePopupItinTags(activePlace);
  document.getElementById('popup-day-select').value='';
  document.getElementById('popup-ts-select').value='';
};

window.removeFromDay = function(date, idx) {
  if (!TRIP.itinerary||!TRIP.itinerary[date]) return;
  TRIP.itinerary[date].splice(idx,1);
  saveItinerary(); renderItinerary(); updatePopupItinTags(activePlace);
  if (activeDay===date) {
    var dayIds=new Set((TRIP.itinerary[date]||[]).map(function(i){return i.placeId;}));
    (TRIP.places||[]).forEach(function(p){ if(markers[p.id]) markers[p.id].setVisible(dayIds.has(p.id)); });
  }
};

window.openTsPicker = function(e, date, idx) {
  e.stopPropagation();
  closeTsPicker();
  var item=((TRIP.itinerary||{})[date]||[])[idx];
  if (!item) return;
  var rect=e.target.getBoundingClientRect();
  var picker=document.createElement('div');
  picker.className='ts-picker'; picker.id='ts-picker';
  picker.style.top=(rect.bottom+6)+'px';
  picker.style.left=Math.min(rect.left,window.innerWidth-180)+'px';
  var opts=[{val:'morning',label:'🌅 Morning'},{val:'afternoon',label:'☀️ Afternoon'},{val:'evening',label:'🌆 Evening'}];
  picker.innerHTML=opts.map(function(o){
    return '<div class="ts-option'+(item.timeSlot===o.val&&!item.customTime?' selected':'')+'" onclick="setTimeSlot(\''+date+'\','+idx+',\''+o.val+'\',null)">'+o.label+'</div>';
  }).join('')+'<input class="ts-custom-input" placeholder="Custom: e.g. 7:30 PM" value="'+(item.customTime||'')+'" oninput="setTimeSlot(\''+date+'\','+idx+',null,this.value)">';
  document.body.appendChild(picker);
  tsPicker=picker;
  setTimeout(function(){ document.addEventListener('click',closeTsPicker,{once:true}); },0);
};

function closeTsPicker() { if(tsPicker){tsPicker.remove();tsPicker=null;} }

window.setTimeSlot = function(date, idx, slot, customTime) {
  var item=((TRIP.itinerary||{})[date]||[])[idx];
  if (!item) return;
  if (customTime!==null) { item.customTime=customTime||null; if(customTime) item.timeSlot=null; }
  else { item.timeSlot=slot; item.customTime=null; closeTsPicker(); }
  saveItinerary(); renderItinerary(); updatePopupItinTags(activePlace);
};

// ── WEATHER ──
async function buildWeatherTab() {
  var el = document.getElementById('tab-weather');
  if (!el) return;
  var days = getTripDays();
  if (!days.length) { el.innerHTML='<div class="empty-res"><div class="empty-icon">🌤️</div>No trip days found.</div>'; return; }
  el.innerHTML='<div style="padding:20px;text-align:center;color:var(--muted);font-size:13px">Loading weather...</div>';
  var hotelPlace = (TRIP.places||[]).find(function(p){return p.type==='hotel';});
  var lat = hotelPlace ? hotelPlace.lat : 29.95;
  var lng = hotelPlace ? hotelPlace.lng : -90.07;
  var start = days[0], end = days[days.length-1];
  var today = new Date(); today.setHours(0,0,0,0);
  var tripStart = new Date(start+'T12:00:00Z');
  var daysUntil = Math.round((tripStart-today)/(1000*60*60*24));
  var useForecast = daysUntil>=0 && daysUntil<=14;
  var fetchStart = start, fetchEnd = end, label = '';
  if (!useForecast) {
    var yr = daysUntil>14 ? -1 : 0;
    fetchStart = start.replace(/^(\d{4})/,function(y){return parseInt(y)+yr;});
    fetchEnd   = end.replace(/^(\d{4})/,function(y){return parseInt(y)+yr;});
    label = daysUntil>14 ? 'Typical weather (last year\'s actuals — forecast available ~2 weeks out)' : 'Historical weather';
  } else { label = '14-day forecast'; }
  try {
    var apiBase = useForecast ? 'https://api.open-meteo.com/v1/forecast' : 'https://archive-api.open-meteo.com/v1/archive';
    var fields = useForecast
      ? 'temperature_2m_max,temperature_2m_min,weathercode,precipitation_probability_max'
      : 'temperature_2m_max,temperature_2m_min,weathercode,precipitation_sum';
    var url = apiBase+'?latitude='+lat+'&longitude='+lng+'&daily='+fields+'&temperature_unit=fahrenheit&timezone=America%2FChicago&start_date='+fetchStart+'&end_date='+fetchEnd;
    var data = await (await fetch(url)).json();
    if (!data.daily) throw new Error('No data');
    var html = '<div style="padding:8px 14px 4px;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:0.06em">'+label+'</div>';
    days.forEach(function(date,i) {
      var code=(data.daily.weathercode||[])[i]||0;
      var hi=Math.round((data.daily.temperature_2m_max||[])[i]||0);
      var lo=Math.round((data.daily.temperature_2m_min||[])[i]||0);
      var precip=(data.daily.precipitation_probability_max||data.daily.precipitation_sum||[])[i];
      var precipLabel = useForecast ? (precip+'% chance rain') : (precip ? precip.toFixed(1)+'" precip' : '');
      html+='<div class="info-section" style="margin-bottom:8px">'
        +'<div style="display:flex;align-items:center;gap:12px;padding:12px 14px">'
        +'<span style="font-size:30px;flex-shrink:0">'+wmoEmoji(code)+'</span>'
        +'<div style="flex:1;min-width:0"><div style="font-size:12px;font-weight:600;color:var(--text)">'+formatDayLabel(date)+'</div>'
        +'<div style="font-size:11px;color:var(--muted);margin-top:2px">'+wmoDesc(code)+'</div></div>'
        +'<div style="text-align:right;flex-shrink:0"><div style="font-size:15px;font-weight:600;color:var(--text)">'+hi+'° / '+lo+'°F</div>'
        +(precipLabel?'<div style="font-size:10px;color:#5cb8e8;margin-top:2px">💧 '+precipLabel+'</div>':'')
        +'</div></div></div>';
    });
    el.innerHTML=html;
  } catch(e) {
    el.innerHTML='<div class="empty-res"><div class="empty-icon">🌤️</div>Could not load weather.<br><span style="font-size:11px;margin-top:4px;display:block;color:var(--muted)">'+e.message+'</span></div>';
  }
}

function wmoEmoji(c){if(c===0)return'☀️';if(c<=2)return'⛅';if(c<=3)return'☁️';if(c<=48)return'🌫️';if(c<=57)return'🌦️';if(c<=67)return'🌧️';if(c<=77)return'🌨️';if(c<=82)return'🌧️';if(c<=86)return'❄️';return'⛈️';}
function wmoDesc(c){if(c===0)return'Clear sky';if(c<=2)return'Partly cloudy';if(c<=3)return'Overcast';if(c<=48)return'Foggy';if(c<=57)return'Drizzle';if(c<=67)return'Rain';if(c<=77)return'Snow';if(c<=82)return'Rain showers';if(c<=86)return'Snow showers';return'Thunderstorm';}

// ── MOBILE PANEL ──
window.toggleMobilePanel = function() {
  var panel = document.querySelector('.panel');
  var backdrop = document.getElementById('panel-backdrop');
  var toggle = document.getElementById('panel-toggle');
  var isOpen = panel.classList.contains('mobile-open');
  panel.classList.toggle('mobile-open', !isOpen);
  backdrop.classList.toggle('show', !isOpen);
  if(toggle) toggle.style.display = isOpen ? '' : 'none';
};

// ── DELETE PLACE ──
window.promptDeletePlace = function(id) {
  pendingDeleteId = id;
  if(activePlace===id) closePopup();
  renderList();
  var el = document.getElementById('li-'+id);
  if(el) el.scrollIntoView({behavior:'smooth',block:'nearest'});
};

window.cancelDeletePlace = function() {
  pendingDeleteId = null;
  renderList();
};

window.confirmDeletePlace = async function(id) {
  if(!TRIP||!TRIP.id) return;
  // Remove from itinerary first
  if(TRIP.itinerary) {
    Object.keys(TRIP.itinerary).forEach(function(date) {
      TRIP.itinerary[date] = (TRIP.itinerary[date]||[]).filter(function(i){return i.placeId!==id;});
    });
  }
  // Remove from places
  TRIP.places = (TRIP.places||[]).filter(function(p){return p.id!==id;});
  pendingDeleteId = null;
  if(activePlace===id) closePopup();
  if(markers[id]) { markers[id].setMap(null); delete markers[id]; }
  try {
    await updateDoc(doc(db,'trips',TRIP.id),{places:TRIP.places, itinerary:TRIP.itinerary||{}});
  } catch(e) { console.error('confirmDeletePlace:',e); }
  renderList();
  renderItinerary();
};

async function saveItinerary() {
  if (!TRIP||!TRIP.id) return;
  try { await updateDoc(doc(db,'trips',TRIP.id),{itinerary:TRIP.itinerary}); }
  catch(e) { console.error('saveItinerary:',e); }
}

document.querySelectorAll('.modal-tab').forEach(tab=>{
  tab.addEventListener('click',function(){
    var t=this.getAttribute('data-tab');
    document.querySelectorAll('.modal-tab').forEach(x=>x.classList.remove('active'));
    document.querySelectorAll('.tab-panel').forEach(x=>x.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('tab-'+t).classList.add('active');
    if(t==='weather') buildWeatherTab();
  });
});

window.openModal=function(){document.getElementById('modal-overlay').classList.add('show');};
window.closeModal=function(){document.getElementById('modal-overlay').classList.remove('show');};
document.getElementById('modal-overlay').addEventListener('click',function(e){if(e.target===this)closeModal();});
